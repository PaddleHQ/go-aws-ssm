version: 2
updates:
  - package-ecosystem: "gomod"
    directory: /
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 4
    labels:
      - "release:patch"
    cooldown:
      default-days: 7
      exclude:
        - "github.com/PaddleHQ/*"
    groups:
      paddlehq:
        patterns:
          - "github.com/PaddleHQ/*"
      aws:
        patterns:
          - "github.com/aws/aws-sdk-go-v2/*"
      otel:
        patterns:
          - "go.opentelemetry.io/otel/*"
      otelcontrib:
        patterns:
          - "go.opentelemetry.io/contrib/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    labels:
      - "norelease"
    cooldown:
      # Longer than the go-library-template's own 7-day cooldown so its action bumps merge
      # and sync down first; libraries only open their own PR as a fallback.
      default-days: 14
