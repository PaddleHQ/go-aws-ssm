# DO NOT EDIT: This file should only be modified in the `go-library-template` repo.

name: Create release on push to main branch

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: read
  actions: write # required for `workflow-dispatch` to trigger the automerge workflow

jobs:
  release_on_push:
    name: Create release on push to main branch
    runs-on: generic-2-core
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create release based on label
        uses: step-security/release-on-push-action@b9dee0685e99e905fe90cba8ba9ed92c7f3806b4 # v0.28.6
        with:
          bump_version_scheme: norelease
          use_github_release_notes: true
          dry_run: ${{ format('refs/heads/{0}', github.event.repository.default_branch) != github.ref }}

      - name: Checkout code # required for automerge
        if: format('refs/heads/{0}', github.event.repository.default_branch) != github.ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Automerge
        if: format('refs/heads/{0}', github.event.repository.default_branch) != github.ref
        uses: ./.github/actions/trigger-automerge
        with:
          event: ${{ toJSON(github.event) }}
          hasAutoApproverPrivateKey: ${{ secrets.AUTO_APPROVER_PRIVATE_KEY != '' }}

  otel_cicd_export:
    name: OpenTelemetry Export Trace
    if: always()
    needs: [release_on_push]
    runs-on: generic-2-core
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout otel-export action
        if: always()
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/actions/otel-export
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Export workflow trace
        if: always()
        uses: ./.github/actions/otel-export
        continue-on-error: true
        with:
          honeycomb-team: ${{ secrets.HONEYCOMB_GHA_SECRET }}
          honeycomb-dataset: ${{ vars.HONEYCOMB_GHA_DATASET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
