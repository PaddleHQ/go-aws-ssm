# DO NOT EDIT: This file should only be modified in the `go-library-template` repo.

name: Create release on push to main branch

on:
  push:
    branches:
      - main
      - master
  # `labeled`/`unlabeled` included so adding a release label re-runs the dry run
  # against the PR's final label set, not whatever was set at the last push.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: write
  pull-requests: read

jobs:
  release_on_push:
    name: Create release on push to main branch
    runs-on: generic-2-core
    timeout-minutes: 5

    # Without a release label the action exits at its own `norelease` check
    # before computing a version, so a dry run on such a PR validates nothing.
    if: |-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'release:major') ||
      contains(github.event.pull_request.labels.*.name, 'release:minor') ||
      contains(github.event.pull_request.labels.*.name, 'release:patch')
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create release based on label
        uses: step-security/release-on-push-action@b9dee0685e99e905fe90cba8ba9ed92c7f3806b4 # v0.28.6
        with:
          bump_version_scheme: norelease
          use_github_release_notes: true
          dry_run: ${{ format('refs/heads/{0}', github.event.repository.default_branch) != github.ref }}

  otel_cicd_export:
    name: OpenTelemetry Export Trace
    if: always() && needs.release_on_push.result != 'skipped'
    needs: [release_on_push]
    runs-on: generic-2-core
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout otel-export action
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/otel-export
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Export workflow trace
        if: always()
        uses: ./.github/actions/otel-export
        continue-on-error: true
        with:
          honeycomb-team: ${{ secrets.HONEYCOMB_GHA_SECRET }}
          honeycomb-dataset: ${{ vars.HONEYCOMB_GHA_DATASET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
