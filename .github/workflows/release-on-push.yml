# DO NOT EDIT: This file should only be modified in the `go-public-library-template` repo.

name: Create release on push to main branch

on:
  push:
    branches:
      - main
      - master
  # labeled/unlabeled re-run the dry run against the PR's final label set.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: read

jobs:
  release_on_push:
    name: Create release on push to main branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Without a release label the action stops at its norelease check, so a dry run validates nothing.
    if: |-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'release:major') ||
      contains(github.event.pull_request.labels.*.name, 'release:minor') ||
      contains(github.event.pull_request.labels.*.name, 'release:patch')
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Create release based on label
        uses: step-security/release-on-push-action@b9dee0685e99e905fe90cba8ba9ed92c7f3806b4 # v0.28.6
        with:
          bump_version_scheme: norelease
          use_github_release_notes: true
          dry_run: ${{ format('refs/heads/{0}', github.event.repository.default_branch) != github.ref }}
