# DO NOT EDIT: This file should only be modified in the `go-public-library-template` repo.

name: Run code validation checks

on:
  merge_group:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Run code validation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            vuln.go.dev:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build
        run: go build ./...

      - name: Verify dependencies
        run: go mod verify

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum ||
            (echo '::error file=go.mod,title=Untidy go.mod::Run "go mod tidy"' && exit 1)

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error title=Unformatted Go files::Run \"gofmt -s -w .\" on: ${unformatted//$'\n'/ }"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Advisory: a newly published vulnerability shouldn't fail PRs that didn't introduce it.
      - name: Check for known vulnerabilities
        shell: bash {0}
        run: |
          result=$(go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./... 2>&1)
          status=$?
          echo "$result"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Known vulnerabilities::govulncheck reported findings, see the job summary"
            {
              echo '## govulncheck'
              echo '```'
              echo "$result"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
