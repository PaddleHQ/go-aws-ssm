# DO NOT EDIT: This file should only be modified in the `go-public-library-template` repo.

name: Ensure SemVer Label is added

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_semver:
    name: Ensure SemVer Label is added
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEPSECURITY_POLICY_STORE_API_KEY }}

      - name: Require exactly one SemVer label
        # The label is checked on the PR; the merge queue re-runs the same commit.
        if: github.event_name == 'pull_request'
        env:
          VALID_LABELS: norelease release:major release:minor release:patch
        run: |
          found=$(jq -r --arg valid "$VALID_LABELS" \
            '[.pull_request.labels[].name | select(. as $l | $valid | split(" ") | index($l))] | join(" ")' \
            "$GITHUB_EVENT_PATH")
          count=$(wc -w <<< "$found")

          if [ "$count" -eq 0 ]; then
            echo "::error::Add one SemVer label to this PR: ${VALID_LABELS// / | }"
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::Only one SemVer label is allowed, found: ${found}"
            exit 1
          fi
          echo "SemVer label: ${found}"
