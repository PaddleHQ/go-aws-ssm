# DO NOT EDIT: This file should only be modified in the `go-library-template` repo.

name: Check API compatibility

# Runs only on pull_request: gorelease needs the PR's labels (to skip
# release:major) and a base release tag, neither of which exist in merge_group.
# Kept in its own workflow so label changes refresh the comment without
# re-running the full validate suite.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

env:
  # Required to enable support for synctest.Run
  # This will be removed once we update to go 1.25
  GOEXPERIMENT: synctest

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  gorelease:
    name: Check API compatibility
    runs-on: go-4-core
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0 # fetch all history + tags to resolve the base version

      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: setup-go
        with:
          owner: ${{ github.repository_owner }}
          private: ${{ github.event.repository.private }}
          private-key: ${{ secrets.PRIVATE_GO_CI_PRIVATE_KEY }}
          cache-suffix: gorelease
          # Keep the GitHub App token in git's credential cache so the gorelease
          # step can fetch the base version's transitive private deps (e.g.
          # go-rest). The repo-scoped GITHUB_TOKEN can't reach other PaddleHQ
          # repos; the App token is owner-scoped. Dropped by "Clear git
          # credentials" below.
          clear-token: 'false'

      - name: Install Go tools
        uses: ./.github/actions/install-go-tools
        with:
          tools: |
            gorelease

      # --
      # API compatibility (gorelease)
      #
      # Checks whether the PR's release label is big enough for the API changes
      # vs the latest release tag for this module's major version. Skipped for
      # release:major PRs (author is knowingly breaking the API). Posts a
      # comment; does not fail the build.
      #
      # We run gorelease with -version set to the version the label implies and
      # key off gorelease's own verdict line, NOT its exit code: gorelease exits
      # non-zero for benign diagnostics too (e.g. retracted transitive deps), so
      # the exit code alone misreads a compatible release as a breaking change.
      # The verdict also encodes gorelease's full semver policy (v0 has no
      # guarantees, pre-releases, /vN path rules) so we don't re-derive it here.

      - name: Run gorelease
        id: gorelease
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'release:major') }}
        shell: bash {0}
        env:
          GONOSUMDB: "github.com/PaddleHQ/*"
          GOPRIVATE: "github.com/PaddleHQ/*"
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # gorelease fetches the base version and resolves its full module
          # graph — including transitive private deps (e.g. go-rest) — via git
          # over HTTPS. It relies on the GitHub App token setup-go left in git's
          # credential cache (clear-token: 'false'); that token is owner-scoped,
          # so it can reach those cross-repo private deps. Cleared by "Clear git
          # credentials" below.
          MODULE_PATH=$(go list -m)
          MAJOR=$(echo "$MODULE_PATH" | grep -oE '/v[0-9]+$' | grep -oE '[0-9]+' || echo "1")
          MAJOR_PREFIX="v${MAJOR}"

          BASE_TAG=$(git tag --list "${MAJOR_PREFIX}.*" --sort=-version:refname \
            | grep -E "^${MAJOR_PREFIX}\.[0-9]+\.[0-9]+$" \
            | head -1)

          if [ -z "$BASE_TAG" ]; then
            echo "No prior release tag for ${MAJOR_PREFIX} — skipping"
            exit 0
          fi

          echo "base_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"

          # The base tag is a clean vMAJOR.MINOR.PATCH (filtered above). Compute
          # the version the PR's release label implies so gorelease can judge
          # whether that bump is sufficient (release:major is excluded by the
          # step `if`).
          base_semver="${BASE_TAG#v}"
          base_major="${base_semver%%.*}"
          base_rest="${base_semver#*.}"
          base_minor="${base_rest%%.*}"
          base_patch="${base_rest##*.}"

          case ",${PR_LABELS}," in
            *,release:patch,*)
              # PR claims patch-only: test a patch bump so we also catch
              # compatible additions that actually require a minor bump.
              PROPOSED="v${base_major}.${base_minor}.$((base_patch + 1))"
              ;;
            *)
              # release:minor, or no release label yet: a minor bump is valid for
              # any compatible change, so this flags only incompatible changes.
              PROPOSED="v${base_major}.$((base_minor + 1)).0"
              ;;
          esac

          # gorelease refuses to run against a dirty work tree, and the
          # setup/install steps above can leave go.mod/go.sum modified. Restore
          # tracked files to the committed PR head so gorelease evaluates exactly
          # what's committed.
          git checkout -- .

          # Capture the API report (stdout) separately from operational errors
          # (stderr, prefixed "gorelease:"). Operational failures print to
          # stderr; the API report and version verdict go to stdout.
          err_file="${RUNNER_TEMP:-/tmp}/gorelease.err"
          report=$(gorelease -base="${BASE_TAG}" -version="${PROPOSED}" 2>"${err_file}")
          tool_err=$(cat "${err_file}")

          # Emit a PR comment whose body is $1 (markdown header lines) followed
          # by the gorelease report in a quoted code block.
          emit_comment() {
            {
              echo 'result<<GORELEASE_EOF'
              printf '%s\n' "$1"
              echo '> ```'
              echo "${report}" | awk '{print "> "$0}'
              echo '> ```'
              echo GORELEASE_EOF
            } >> "$GITHUB_OUTPUT"
          }

          if [ -n "${tool_err}" ]; then
            # gorelease errored before producing a report — fail loudly rather
            # than mislabel a tool failure as an API problem.
            echo "::error::gorelease could not run against ${BASE_TAG}: ${tool_err}"
            exit 1
          elif printf '%s' "${report}" | grep -qF 'There are incompatible changes.'; then
            emit_comment "> [!CAUTION]
          > ## :rotating_light: Breaking API changes detected
          > \`gorelease\` found incompatible changes vs \`${BASE_TAG}\`. If intentional, change the semver label to \`release:major\`."
          elif printf '%s' "${report}" | grep -qF 'the minor version is not incremented'; then
            emit_comment "> [!WARNING]
          > ## :warning: Release label too low
          > \`gorelease\` found compatible API additions vs \`${BASE_TAG}\`, but this PR is not labelled \`release:minor\`. Change the semver label to \`release:minor\`."
          else
            echo "Release label is sufficient for the API changes vs ${BASE_TAG}"
          fi

      # Drop the App-token credential setup-go left cached (clear-token:
      # 'false'). Always runs so the token never outlives the job.
      - name: Clear git credentials
        if: always()
        shell: bash
        run: git credential-cache exit || true

      - name: Delete previous gorelease comment
        uses: step-security/actions-comment-pull-request@60cd38988a354b2d22b47612fb02a20e822d6048 # v3.0.2
        with:
          comment-tag: gorelease
          mode: delete

      - name: Comment PR with release-label issue
        if: ${{ steps.gorelease.outputs.result != '' }}
        uses: step-security/actions-comment-pull-request@60cd38988a354b2d22b47612fb02a20e822d6048 # v3.0.2
        with:
          comment-tag: gorelease
          mode: upsert
          message: ${{ steps.gorelease.outputs.result }}
