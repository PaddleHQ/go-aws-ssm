# DO NOT EDIT: This file should only be modified in the `go-library-template` repo.
name: Check modified autogenerated files

on:
  pull_request:

permissions:
  contents: read
  actions: write # required for `workflow-dispatch` to trigger the automerge workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-do-not-edit:
    runs-on: generic-2-core
    timeout-minutes: 10
    name: Check for DO NOT EDIT files

    # File-sync PRs are supposed to rewrite DO NOT EDIT files, so the check has
    # nothing useful to say about them.
    if: github.actor != 'paddle-repo-file-sync[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0 # fetch all history to allow diff

      - name: Check for DO NOT EDIT warnings
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "Checking changed files for DO NOT EDIT warnings..."

          # Create a flag to track if any warnings were found
          warnings_found=false

          # Get changed files using git diff
          echo "Getting changed files from git diff..."
          base_ref="${BASE_REF#refs/heads/}"
          merge_base=$(git merge-base "origin/${base_ref}" HEAD)

          echo "Merge base: $merge_base"
          changed_files=$(git diff --name-only --merge-base "$merge_base")

          if [[ -z "$changed_files" ]]; then
            echo "No changed files found."
            exit 0
          fi

          echo "Changed files:"
          echo "$changed_files"

          # Read changed files into an array
          IFS=$'\n' read -d '' -r -a changed_files_array <<< "$changed_files" || true

          for file in "${changed_files_array[@]}"; do
            if [[ -f "$file" ]]; then
              echo "Checking file: $file"

              # Check first line for DO NOT EDIT (case insensitive)
              if head -n 1 "$file" | grep -i "do not edit" > /dev/null 2>&1; then
                echo "::warning file=$file,line=1::This file contains 'DO NOT EDIT' warning. Please do not edit this file manually as it may be auto-generated."
                warnings_found=true
                echo "Found DO NOT EDIT warning in: $file"
              fi
            fi
          done

          if [[ "$warnings_found" == "true" ]]; then
            echo "::notice::Some files contain DO NOT EDIT warnings. Please review the annotations above."
          else
            echo "No DO NOT EDIT warnings found in changed files."
          fi

      - name: Automerge
        uses: ./.github/actions/trigger-automerge
        with:
          event: ${{ toJSON(github.event) }}
          hasAutoApproverPrivateKey: ${{ secrets.AUTO_APPROVER_PRIVATE_KEY != '' }}

  otel_cicd_export:
    name: OpenTelemetry Export Trace
    # always() alone still runs when the checked job is skipped, so a bot PR would
    # export a trace for a job that did nothing.
    if: always() && needs['check-do-not-edit'].result != 'skipped'
    needs: [check-do-not-edit]
    runs-on: generic-2-core
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout otel-export action
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/otel-export
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Export workflow trace
        if: always()
        uses: ./.github/actions/otel-export
        continue-on-error: true
        with:
          honeycomb-team: ${{ secrets.HONEYCOMB_GHA_SECRET }}
          honeycomb-dataset: ${{ vars.HONEYCOMB_GHA_DATASET }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
