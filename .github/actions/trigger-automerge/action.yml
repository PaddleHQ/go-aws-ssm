# DO NOT EDIT: This file should only be modified in the `go-library-template` repo.

name: Trigger Automerge
description: |
  This is a helper function to trigger the automerge action.

inputs:
  event:
    description: 'The PR event'
    required: true
  hasAutoApproverPrivateKey:
    description: 'A boolean value indicating if the private key for the auto approver GitHub App is set'
    required: true

runs:
  using: "composite"
  steps:
    - name: Attempt to automerge
      # continue-on-error so the calling job doesn't fail when the target
      # workflow isn't yet on the default branch (e.g. the sync PR that
      # first introduces automerge.yml). Dispatch is fire-and-forget; the
      # PR can always be merged manually.
      continue-on-error: true
      if: fromJSON(inputs.event).pull_request != null &&
          inputs.hasAutoApproverPrivateKey == 'true' &&
          fromJSON(inputs.event).pull_request.merged == false &&
          fromJSON(inputs.event).pull_request.draft == false &&
          fromJSON(inputs.event).pull_request.state == 'open'
      uses: step-security/workflow-dispatch@024752877e2bfa07299ee4204cc5f7e7c14ff930 # v1.3.21
      with:
        workflow: automerge.yml
        # Take the head branch from the event payload rather than github.head_ref,
        # which is only set on pull_request/pull_request_target events. On other
        # trigger types (e.g. pull_request_review, check_run) head_ref is empty and
        # github.ref_name resolves to a non-branch ref (like "<pr>/merge") or the wrong
        # branch, so the dispatch fails. inputs.event.pull_request is guaranteed here by
        # the guard above and is present on every path that invokes this action.
        ref: ${{ fromJSON(inputs.event).pull_request.head.ref }}
        inputs: '{
            "pr_number": "${{ fromJSON(inputs.event).pull_request.number }}"
          }'

    - name: Attempt to auto ready for review
      continue-on-error: true
      if: fromJSON(inputs.event).pull_request != null &&
          fromJSON(inputs.event).pull_request.draft == true
      uses: step-security/workflow-dispatch@024752877e2bfa07299ee4204cc5f7e7c14ff930 # v1.3.21
      with:
        workflow: auto-ready-for-review.yml
        # See note above: source the head branch from the event payload so dispatch
        # works regardless of the triggering event type.
        ref: ${{ fromJSON(inputs.event).pull_request.head.ref }}
        inputs: '{
            "pr_number": "${{ fromJSON(inputs.event).pull_request.number }}",
            "head_sha": "${{ fromJSON(inputs.event).pull_request.head.sha }}",
            "workflow": "${{ github.workflow }}"
          }'
